name: Staleproof docs check
description: Comment on each pull request with the docs it makes false, with evidence, and run their examples. Audit docs on a schedule.
author: Raj Karia
branding:
  icon: book-open
  color: green

inputs:
  mode:
    description: "`auto` (default): check the pull request on pull_request events, audit the docs otherwise (schedule, workflow_dispatch, push); `check` or `audit` to force one."
    default: auto
  also-index:
    description: Other repositories to index together with this one, space- or comma-separated (e.g. your docs site `acme/docs`), so links across them resolve.
    default: ''
  anthropic-api-key:
    description: Optional. With a model key the agent judges every impacted section and proposes the edits; without one the graph tools run in a fixed order (no key needed).
    default: ''
  model:
    description: Optional model for agent mode (default claude-sonnet-5-5). For an Anthropic-compatible provider, also set base-url.
    default: ''
  base-url:
    description: Optional Anthropic-compatible API base URL for agent mode (e.g. https://api.deepseek.com/anthropic).
    default: ''
  runs:
    description: Graph mode runs up to this many affected examples before and after the pull request (0 to skip).
    default: '3'
  fail-on:
    description: "`never` (default); `breaks`: fail the job when an example passes before the pull request and fails after it; `predicted`: also fail when a static check predicts an example's call no longer fits the changed code; `mismatches` (audit): fail when any example no longer fits the code."
    default: never
  fail-under:
    description: Audit mode. Fail the job when the docs health score is below this (0-100).
    default: ''
  audit-runs:
    description: Audit mode. Run up to this many examples at the default branch (0 for static checks only).
    default: '20'
  issue:
    description: Audit mode. Keep one issue up to date with the audit (opened when something needs fixing, closed when all clear). Needs `issues write`.
    default: 'true'
  open-docs-pr:
    description: Agent mode on a pull request from this repository. Open the proposed docs edits as a pull request into the checked pull request's branch. Needs `contents write`.
    default: 'false'
  comment:
    description: Post (and keep updating) one pull request comment. The report always goes to the job summary.
    default: 'true'
  pr-url:
    description: The pull request to check. Defaults to the one that triggered the workflow.
    default: ''
  falkordb-url:
    description: Optional. A FalkorDB that keeps your graph between runs (decisions, verdicts and run history). Default is a throwaway FalkorDB in the job.
    default: ''
  org:
    description: Graph name on falkordb-url (default is the repository owner, lower case). Ignored without falkordb-url.
    default: ''
  reindex:
    description: With falkordb-url, re-index this repository (and `also-index`) at the default branch before checking.
    default: 'false'
  github-token:
    description: Token to read the repository and post the comment. Private repositories work with the default token.
    default: ${{ github.token }}
  version:
    description: The staleproof npm version to run, or `source` to build the CLI from this action's checkout.
    default: '0.4.0'

outputs:
  report:
    description: Path of the Markdown report (the comment).
    value: ${{ steps.check.outputs.report }}
  breaks:
    description: How many docs examples pass before the pull request and fail after it.
    value: ${{ steps.check.outputs.breaks }}
  predicted:
    description: How many docs examples a static check predicts the pull request breaks (their call no longer fits the changed code).
    value: ${{ steps.check.outputs.predicted }}
  score:
    description: Audit mode. The docs health score (0-100).
    value: ${{ steps.audit.outputs.score }}
  mismatched:
    description: Audit mode. How many examples no longer fit the code.
    value: ${{ steps.audit.outputs.mismatched }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        # The job has no checkout of its own; uv's cache is keyed by the runner, not a lock file.
        enable-cache: false
        ignore-empty-workdir: true

    - name: Start FalkorDB
      id: db
      shell: bash
      env:
        FALKORDB_URL_INPUT: ${{ inputs.falkordb-url }}
      run: |
        if [ -n "$FALKORDB_URL_INPUT" ]; then
          echo "Using the FalkorDB from the falkordb-url input."
          exit 0
        fi
        if command -v docker >/dev/null 2>&1; then
          # One server for the graph, one disposable server the docs examples run against.
          docker run -d --name staleproof-graph -p 6379:6379 falkordb/falkordb:latest >/dev/null
          docker run -d --name staleproof-scratch -p 6390:6379 falkordb/falkordb:latest >/dev/null
          for i in $(seq 1 90); do
            if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/6390) 2>/dev/null; then break; fi
            sleep 1
          done
          echo "FALKORDB_URL=falkor://localhost:6379" >> "$GITHUB_ENV"
          echo "STALEPROOF_SCRATCH_URL=falkor://localhost:6390" >> "$GITHUB_ENV"
        else
          echo "No Docker on this runner: staleproof starts FalkorDB itself (falkordblite)."
        fi

    - name: Install staleproof
      id: cli
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        from_source() {
          cd "$GITHUB_ACTION_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsup >/dev/null
          echo "cli=node $GITHUB_ACTION_PATH/dist/cli.js" >> "$GITHUB_OUTPUT"
        }
        if [ "$VERSION" = "source" ]; then
          from_source
        elif npm install -g "staleproof@$VERSION" --no-audit --no-fund >/dev/null; then
          echo "cli=staleproof" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::staleproof@$VERSION is not on npm; building it from this action's source instead."
          from_source
        fi

    - name: Choose check or audit
      id: mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PR_URL: ${{ inputs.pr-url || github.event.pull_request.html_url }}
      run: |
        case "$MODE" in
          check|audit) mode="$MODE" ;;
          auto|'') if [ -n "$PR_URL" ]; then mode=check; else mode=audit; fi ;;
          *) echo "::error::mode must be auto, check or audit (got $MODE)"; exit 1 ;;
        esac
        echo "Staleproof mode: $mode"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"

    - name: Re-index
      if: inputs.reindex == 'true' && inputs.falkordb-url != ''
      shell: bash
      env:
        FALKORDB_URL: ${{ inputs.falkordb-url }}
        STALEPROOF_ORG: ${{ inputs.org }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        WITH: ${{ inputs.also-index }}
        REPO: ${{ github.repository }}
      run: ${{ steps.cli.outputs.cli }} index "$REPO" $(echo "$WITH" | tr ',' ' ')

    - name: Check the pull request
      id: check
      if: steps.mode.outputs.mode == 'check'
      shell: bash
      env:
        FALKORDB_URL_INPUT: ${{ inputs.falkordb-url }}
        ORG: ${{ inputs.org }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_BASE_URL: ${{ inputs.base-url }}
        STALEPROOF_MODEL: ${{ inputs.model }}
        PR_URL: ${{ inputs.pr-url || github.event.pull_request.html_url }}
        WITH: ${{ inputs.also-index }}
        RUNS: ${{ inputs.runs }}
        FAIL_ON: ${{ inputs.fail-on }}
        CLI: ${{ steps.cli.outputs.cli }}
      run: |
        if [ -z "$PR_URL" ]; then
          echo "::error::No pull request to check: run this on pull_request events, or set pr-url."
          exit 1
        fi
        [ -n "$FALKORDB_URL_INPUT" ] && export FALKORDB_URL="$FALKORDB_URL_INPUT"
        [ -n "$FALKORDB_URL_INPUT" ] && [ -n "$ORG" ] && export STALEPROOF_ORG="$ORG"
        [ -z "$ANTHROPIC_BASE_URL" ] && unset ANTHROPIC_BASE_URL
        [ -z "$STALEPROOF_MODEL" ] && unset STALEPROOF_MODEL
        mode="--no-agent"
        if [ -n "$ANTHROPIC_API_KEY" ]; then mode=""; else unset ANTHROPIC_API_KEY; fi
        with_args=()
        for r in $(echo "$WITH" | tr ',' ' '); do with_args+=("$r"); done
        report="$RUNNER_TEMP/staleproof-report.md"
        status=0
        $CLI check "$PR_URL" $mode --runs "$RUNS" --format markdown --out "$report" ${with_args[@]:+--with "${with_args[@]}"} || status=$?
        echo "report=$report" >> "$GITHUB_OUTPUT"
        breaks=0
        predicted=0
        if [ -f "$report" ]; then
          counts=$(grep -o '<!-- staleproof:counts [^>]*-->' "$report" | tail -1 || true)
          if [ -n "$counts" ]; then
            breaks=$(echo "$counts" | sed -E 's/.*breaks=([0-9]+).*/\1/')
            predicted=$(echo "$counts" | sed -E 's/.*predicted=([0-9]+).*/\1/')
          else
            breaks=$(grep -c '| \*\*breaks\*\*' "$report" || true)
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "breaks=$breaks" >> "$GITHUB_OUTPUT"
        echo "predicted=$predicted" >> "$GITHUB_OUTPUT"
        if [ "$status" != "0" ] && [ ! -f "$report" ]; then
          echo "::error::staleproof check failed (exit $status); see the log above."
          exit "$status"
        fi
        [ "$status" != "0" ] && echo "::warning::staleproof check ended with exit $status; the report may be incomplete."
        exit 0

    - name: Post or update the comment
      if: always() && steps.mode.outputs.mode == 'check' && inputs.comment == 'true' && steps.check.outputs.report != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_URL: ${{ inputs.pr-url || github.event.pull_request.html_url }}
        REPORT: ${{ steps.check.outputs.report }}
      run: |
        [ -f "$REPORT" ] || exit 0
        repo=$(echo "$PR_URL" | sed -E 's#https://github.com/([^/]+/[^/]+)/pull/.*#\1#')
        number=$(echo "$PR_URL" | sed -E 's#.*/pull/([0-9]+).*#\1#')
        existing=$(gh api "repos/$repo/issues/$number/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- staleproof -->") or startswith("<!-- lockstep-docs -->"))][0].id // empty' 2>/dev/null || true)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -F body=@"$REPORT" >/dev/null && echo "Updated the Staleproof comment." && exit 0
        else
          gh api -X POST "repos/$repo/issues/$number/comments" -F body=@"$REPORT" >/dev/null && echo "Posted the Staleproof comment." && exit 0
        fi
        echo "::warning::Could not comment on the pull request (pull requests from forks get a read-only token). The report is in the job summary."

    - name: Open the docs fix as a pull request
      if: inputs.open-docs-pr == 'true' && steps.mode.outputs.mode == 'check' && inputs.anthropic-api-key != '' && steps.check.outputs.report != '' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_URL: ${{ inputs.pr-url || github.event.pull_request.html_url }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REPO: ${{ github.repository }}
        REPORT: ${{ steps.check.outputs.report }}
        CLI: ${{ steps.cli.outputs.cli }}
      run: |
        if ! grep -q 'Proposed edits:' "$REPORT"; then echo "No proposed docs edits."; exit 0; fi
        # Into the pull request's own branch, so the docs fix lands with the code change.
        $CLI patch "$PR_URL" --open-pr --in-repo --base "$HEAD_REF" --only "$REPO" \
          || echo "::warning::Could not open the docs fix pull request (the job needs contents: write and pull-requests: write)."

    - name: Audit the docs
      id: audit
      if: steps.mode.outputs.mode == 'audit'
      shell: bash
      env:
        FALKORDB_URL_INPUT: ${{ inputs.falkordb-url }}
        ORG: ${{ inputs.org }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        WITH: ${{ inputs.also-index }}
        RUNS: ${{ inputs.audit-runs }}
        CLI: ${{ steps.cli.outputs.cli }}
      run: |
        [ -n "$FALKORDB_URL_INPUT" ] && export FALKORDB_URL="$FALKORDB_URL_INPUT"
        [ -n "$FALKORDB_URL_INPUT" ] && [ -n "$ORG" ] && export STALEPROOF_ORG="$ORG"
        report="$RUNNER_TEMP/staleproof-audit.md"
        status=0
        $CLI audit "$REPO" $(echo "$WITH" | tr ',' ' ') --run "$RUNS" --format markdown --out "$report" || status=$?
        if [ ! -f "$report" ]; then
          echo "::error::staleproof audit failed (exit $status); see the log above."
          exit 1
        fi
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        counts=$(grep -o '<!-- staleproof:audit [^>]*-->' "$report" | tail -1)
        score=$(echo "$counts" | sed -E 's/.*score=([0-9]+).*/\1/')
        mismatched=$(echo "$counts" | sed -E 's/.*mismatched=([0-9]+).*/\1/')
        failing=$(echo "$counts" | sed -E 's/.*failing=([0-9]+).*/\1/')
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "mismatched=$mismatched" >> "$GITHUB_OUTPUT"
        echo "failing=$failing" >> "$GITHUB_OUTPUT"

    - name: Keep the audit issue up to date
      if: steps.mode.outputs.mode == 'audit' && inputs.issue == 'true' && steps.audit.outputs.report != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        REPORT: ${{ steps.audit.outputs.report }}
        SCORE: ${{ steps.audit.outputs.score }}
        MISMATCHED: ${{ steps.audit.outputs.mismatched }}
        FAILING: ${{ steps.audit.outputs.failing }}
      run: |
        existing=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
          --jq '[.[] | select(.pull_request == null) | select((.body // "") | startswith("<!-- staleproof-audit -->"))][0].number // empty' 2>/dev/null || true)
        todo=$(( ${MISMATCHED:-0} + ${FAILING:-0} ))
        if [ "${MISMATCHED:-0}" != "0" ]; then
          title="Docs health $SCORE/100: $MISMATCHED example(s) no longer fit the code"
        elif [ "${FAILING:-0}" != "0" ]; then
          title="Docs health $SCORE/100: $FAILING example(s) fail when run"
        else
          title="Docs health $SCORE/100"
        fi
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/$existing" -f title="$title" -F body=@"$REPORT" >/dev/null && echo "Updated issue #$existing."
          if [ "$todo" = "0" ]; then
            gh api -X POST "repos/$REPO/issues/$existing/comments" -f body="All clear: every docs example fits the code again. Closing." >/dev/null
            gh api -X PATCH "repos/$REPO/issues/$existing" -f state=closed >/dev/null && echo "Closed issue #$existing."
          fi
        elif [ "$todo" != "0" ]; then
          gh api -X POST "repos/$REPO/issues" -f title="$title" -F body=@"$REPORT" --jq '"Opened issue #\(.number)."' \
            || echo "::warning::Could not open the audit issue (the job needs issues: write). The report is in the job summary."
        else
          echo "Nothing to fix: no issue opened."
        fi

    - name: Fail on the audit
      if: steps.mode.outputs.mode == 'audit' && ((inputs.fail-on == 'mismatches' && steps.audit.outputs.mismatched != '0') || (inputs.fail-under != '' && fromJSON(steps.audit.outputs.score || '100') < fromJSON(inputs.fail-under)))
      shell: bash
      env:
        SCORE: ${{ steps.audit.outputs.score }}
        MISMATCHED: ${{ steps.audit.outputs.mismatched }}
      run: |
        echo "::error::Docs health $SCORE/100; $MISMATCHED example(s) no longer fit the code. See the report in the job summary."
        exit 1

    - name: Fail on broken examples
      if: steps.mode.outputs.mode == 'check' && (inputs.fail-on == 'breaks' || inputs.fail-on == 'predicted') && steps.check.outputs.breaks != '0' && steps.check.outputs.breaks != ''
      shell: bash
      env:
        BREAKS: ${{ steps.check.outputs.breaks }}
      run: |
        echo "::error::This pull request breaks $BREAKS docs example(s): they pass before it and fail after. See the report in the job summary."
        exit 1

    - name: Fail on predicted breaks
      if: steps.mode.outputs.mode == 'check' && inputs.fail-on == 'predicted' && steps.check.outputs.predicted != '0' && steps.check.outputs.predicted != ''
      shell: bash
      env:
        PREDICTED: ${{ steps.check.outputs.predicted }}
      run: |
        echo "::error::A static check predicts this pull request breaks $PREDICTED docs example(s): their calls no longer fit the changed code. See the report in the job summary."
        exit 1
