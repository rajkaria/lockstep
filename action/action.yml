name: Lockstep docs check
description: Comment on a pull request with the docs it can falsify, across every repository in your Lockstep graph, with the evidence path for each.
author: Lockstep
branding:
  icon: link
  color: green

inputs:
  falkordb-url:
    description: FalkorDB holding your organisation's Lockstep graph (falkor[s]://user:password@host:port). Store it as a secret.
    required: true
  org:
    description: Graph name (your organisation slug, as used with `lockstep-docs index --org`).
    required: true
  github-token:
    description: Token used to read the pull request and post the comment.
    default: ${{ github.token }}
  anthropic-api-key:
    description: Optional. With a key the agent judges each section and proposes edits; without one the graph tools run in a fixed order.
    default: ''
  reindex:
    description: Re-index this repository at the base branch before checking (keeps the graph current).
    default: 'false'
  version:
    description: lockstep-docs version to run.
    default: latest

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Re-index this repository
      if: inputs.reindex == 'true'
      shell: bash
      env:
        FALKORDB_URL: ${{ inputs.falkordb-url }}
        LOCKSTEP_ORG: ${{ inputs.org }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: npx -y "lockstep-docs@${{ inputs.version }}" index "${{ github.repository }}"

    - name: Check the pull request
      shell: bash
      env:
        FALKORDB_URL: ${{ inputs.falkordb-url }}
        LOCKSTEP_ORG: ${{ inputs.org }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        mode="--no-agent"
        if [ -n "$ANTHROPIC_API_KEY" ]; then mode=""; fi
        npx -y "lockstep-docs@${{ inputs.version }}" check "$PR_URL" $mode --format markdown --out lockstep-comment.md

    - name: Post or update the comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- lockstep-docs -->"))][0].id // empty')
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@lockstep-comment.md >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@lockstep-comment.md >/dev/null
        fi
